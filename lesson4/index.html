<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap utilities</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        .jumbotron{
            background-color: aqua;
            padding: 25px;
        }
    </style>
</head>
<body>

    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1>My science lab</h1>
            <p class="lead">Welcome to the lab!here are the experts running,the discoveries made,and how far each research project has reached</p>
            <button class="btn btn-primary">chemistry</button>
            <button class="btn btn-success">Biology</button>
            <button class="btn btn-warning">physics</button>
            <button class="btn btn-danger">Astronomy</button>
        </div>

    </div>
    <div class="container">
        <h2 class="section-title">experiments completed<span class="badge badge-danger">4</span></h2>
        <p>chemistry <span class="badge badge-primary">4experiments</span></p>
            <p>Biology <span class="badge badge-success">3experiments</span></p>
            <p>Physics</p> <span class="badge badge-warning">2experiments</span></p>
            <p>Astronomy <span class="badge badge-danger">1experiments</span></p>

            <h2 class="section-title">Research progress bar</h2>
            <p>Biology</p>
            <div class="progress mb-3">
                <div class="progress-bar badge-primary" style="width: 85%"></div>
            </div>
    </div>
    <script>src="
https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"</script>

</body>
</html>
